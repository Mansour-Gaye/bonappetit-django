<div class="d-flex align-items-center menu-card p-3 h-100">
    {% if menu.image %}
    <img class="flex-shrink-0 img-fluid rounded" src="{{ menu.image.url }}" alt="{{ menu.nom }}" style="width: 80px; height: 80px; object-fit: cover;">
    {% endif %}
    <div class="w-100 d-flex flex-column text-start ps-4">
        <h5 class="d-flex justify-content-between border-bottom pb-2">
            <span>{{ menu.nom }}</span>
            <span class="text-primary">{{ menu.prix }} FCFA</span>
        </h5>
        {% if menu.description %}
        <small class="fst-italic">{{ menu.description|truncatewords:15 }}</small>
        {% endif %}
        <div class="mt-2 d-flex align-items-center">
                <a href="{% url 'menus:detail_menu' menu.id_menu %}" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="fas fa-info-circle me-1"></i>Détails
                </a>
                <form method="post" action="{% url 'commandes:ajouter_au_panier' menu.id_menu %}" class="add-to-cart-form d-inline">
                    {% csrf_token %}
                    <input type="hidden" name="menu_id" value="{{ menu.id_menu }}">
                    <input type="hidden" name="quantite" value="1">
                    <button type="submit" class="btn btn-add-to-cart btn-sm">
                        <i class="fas fa-shopping-cart me-1"></i>Ajouter
                    </button>
                </form>
        </div>
    </div>
</div>
